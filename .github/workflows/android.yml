name: Build debug APK
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          targets: aarch64-linux-android
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Core unit tests (host)
        run: cargo test -p launcher-core

      - name: Android SDK/NDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Build Rust launcher (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: cargo ndk -t arm64-v8a -P 26 -o android/app/src/main/jniLibs build -p launcher-ui --release

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }

      - name: Assemble debug APK
        run: gradle -p android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: rustcraft-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
